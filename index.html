<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F6F2; --paper:#FFFFFF; --ink:#1B2723; --ink2:#4A5953; --muted:#7A8781; --line:#D9E0DA;
  --accent:#1F6B57; --accent-ink:#FFFFFF; --accent-soft:#DCEFE6; --mark:#F3C546; --mark-soft:#FFF3C7; --route:#D0573B;
  --ground:#EBF0E7; --road:#D5DAD6; --apt:#E1E3EA; --field:#E7DCCB; --track:#E3B6A3;
  --r-cls:#FFE9A8; --r-sp:#DCEBFB; --r-adm:#E3F4E6; --r-kid:#FCE4EC; --r-wc:#E4E9EF; --r-hall:#F7F8F9; --r-aft:#FFD3B0;
  --r-stroke:#8C9A94; --r-text:#34423D;
  --tag-bg:#FFFFFF; --dim:.32;
  --r-path:#F2E2C4; --r-path-line:#D9C39C; --site-bg:#FFFFFF;
  --day-pink:#FCE6EE; --day-pink-line:#F2B8CC; --help-fill:#E9E0FA; --help-line:#7A5CC2;
  --cal-sun:#FDECEC; --cal-sat:#E8F1FD; --cal-sun-ink:#C0392B; --cal-sat-ink:#2D6CC0;
  --s-guest:#FBE5D6; --s-att:#E4E6E3; --s-env:#E2F0D9; --s-data:#FFF2CC; --s-cls:#DEEBF7; --s-plan:#FFCCFF; --s-fix:#6F7A75; --s-fix-ink:#FFFFFF; --s-table:#C3C9C6;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-disp:"Do Hyeon","IBM Plex Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121A17; --paper:#1A2420; --ink:#E6EEEA; --ink2:#B4C2BB; --muted:#8A9A93; --line:#2E3B36;
    --accent:#5FC3A0; --accent-ink:#0E1714; --accent-soft:#1F3A31; --mark:#F3C546; --mark-soft:#3E3518; --route:#F08A6E;
    --ground:#18221E; --road:#2A3431; --apt:#262B35; --field:#2C2720; --track:#5A3A30;
    --r-cls:#4A4124; --r-sp:#233447; --r-adm:#233A2B; --r-kid:#46303A; --r-wc:#2C333B; --r-hall:#1E2724; --r-aft:#4D3627;
    --r-stroke:#5E6E67; --r-text:#D4DED9; --tag-bg:#1A2420; --dim:.3;
    --r-path:#4A3E2A; --r-path-line:#6E5E40; --site-bg:#151D1A;
    --day-pink:#3B2530; --day-pink-line:#6E3F52; --help-fill:#30284A; --help-line:#A68BE8;
    --cal-sun:#3A2326; --cal-sat:#1E2B3D; --cal-sun-ink:#F08A80; --cal-sat-ink:#86B4F0;
    --s-guest:#4A3426; --s-att:#2A322F; --s-env:#263A2A; --s-data:#45401F; --s-cls:#22354A; --s-plan:#4A2A4A; --s-fix:#56625D; --s-fix-ink:#F0F4F2; --s-table:#3A4440;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121A17; --paper:#1A2420; --ink:#E6EEEA; --ink2:#B4C2BB; --muted:#8A9A93; --line:#2E3B36;
  --accent:#5FC3A0; --accent-ink:#0E1714; --accent-soft:#1F3A31; --mark:#F3C546; --mark-soft:#3E3518; --route:#F08A6E;
  --ground:#18221E; --road:#2A3431; --apt:#262B35; --field:#2C2720; --track:#5A3A30;
  --r-cls:#4A4124; --r-sp:#233447; --r-adm:#233A2B; --r-kid:#46303A; --r-wc:#2C333B; --r-hall:#1E2724; --r-aft:#4D3627;
  --r-stroke:#5E6E67; --r-text:#D4DED9; --tag-bg:#1A2420; --dim:.3;
  --r-path:#4A3E2A; --r-path-line:#6E5E40; --site-bg:#151D1A;
  --day-pink:#3B2530; --day-pink-line:#6E3F52; --help-fill:#30284A; --help-line:#A68BE8;
  --cal-sun:#3A2326; --cal-sat:#1E2B3D; --cal-sun-ink:#F08A80; --cal-sat-ink:#86B4F0;
  --s-guest:#4A3426; --s-att:#2A322F; --s-env:#263A2A; --s-data:#45401F; --s-cls:#22354A; --s-plan:#4A2A4A; --s-fix:#56625D; --s-fix-ink:#F0F4F2; --s-table:#3A4440;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:18px 40px}
.wrap{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:13px;letter-spacing:.04em;color:var(--accent);font-weight:600;margin:0}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(26px,3.2vw,38px);line-height:1.15;margin:2px 0 4px;text-wrap:balance}
.meta{color:var(--ink2);margin:0;font-size:14px}
.meta b{color:var(--ink);font-weight:600}
.savebox{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:13px;color:var(--muted)}
.savebox .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--accent)} .dot.busy{background:var(--mark)} .dot.warn{background:var(--route)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--ink2)}
.ghost:hover{border-color:var(--ink2)}
.modebox{gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
.seg button{border:none;background:none;border-radius:999px;padding:5px 14px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.leadbtn{border:1.5px solid var(--accent);background:var(--paper);color:var(--accent);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:600}
.leadbtn[aria-pressed="true"]{background:var(--mark);border-color:#1B2723;color:#1B2723}
.syncstatus{font-size:12.5px;color:var(--ink2)}
.syncbadge{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--accent-soft);color:var(--accent);align-self:center}
.syncbadge.lead{background:var(--mark);color:#1B2723}
.ghost.danger{border-color:var(--route);color:var(--route)}

/* steps */
.steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px}
.step{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;position:relative}
.step .t{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);font-weight:500}
.step .n{font-family:var(--f-disp);font-size:18px;line-height:1.2}
.step .k{position:absolute;top:8px;right:10px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.step[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step[aria-current="step"] .t,.step[aria-current="step"] .k{color:var(--accent-ink);opacity:.85}
.step:not([aria-current="step"]):hover{border-color:var(--accent)}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(320px,1fr);gap:16px;align-items:start}
.phasehead{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;position:sticky;top:var(--steps-h,76px);z-index:4;background:var(--bg);padding-block:6px 8px}
.phasehead .time{font-family:var(--f-disp);font-size:clamp(28px,3.4vw,44px);color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.phasehead h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(24px,2.6vw,34px);margin:0;line-height:1.1}
.phasehead p{margin:0;color:var(--ink2);flex-basis:100%}
.nav{margin-left:auto;display:flex;gap:6px}
.nav button{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px}
.nav{align-items:center}
.nav button:disabled{opacity:.4;cursor:default}
.nav .pos{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
.nav #nextBtn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.nav #nextBtn:disabled{background:var(--paper);color:var(--ink);border-color:var(--line)}
.nav #fsBtn{font-size:13px}
.bul{width:10px;height:10px;border-radius:50%;background:var(--accent);margin:8px 0 0 8px}
.stage:fullscreen{background:var(--bg);padding:0 20px 16px;overflow:auto;grid-template-columns:minmax(0,2.4fr) minmax(300px,1fr);align-content:start}
.stage.fs{position:fixed;inset:0;z-index:50;background:var(--bg);padding:0 20px 16px;overflow:auto;grid-template-columns:minmax(0,2.4fr) minmax(300px,1fr);align-content:start}
.stage:fullscreen .tasks,.stage.fs .tasks{position:sticky;top:calc(var(--ph-h,96px) + 8px);max-height:calc(100vh - var(--ph-h,96px) - 24px);overflow:auto}
/* 전체화면: 시간·제목·이전/다음 줄을 화면 맨 위에 고정 */
.stage:fullscreen .phasehead,.stage.fs .phasehead{position:sticky;top:0;z-index:10;background:var(--bg);padding-block:12px 10px;box-shadow:0 1px 0 var(--line)}
@media (max-width:1080px){.stage:fullscreen,.stage.fs{grid-template-columns:minmax(0,1fr)}.stage:fullscreen .tasks,.stage.fs .tasks{position:static;max-height:none;overflow:visible}}
.maps{display:flex;flex-direction:column;gap:12px;min-width:0}
figure{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 10px 8px;min-width:0}
figcaption{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:0 4px 6px}
figcaption b{color:var(--ink);font-weight:600}
.svgbox{overflow:hidden;border-radius:8px}
svg.map{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
svg.map.dragging{cursor:grabbing}
svg.map.dragging .tag{cursor:grabbing}
.zoomctl{display:inline-flex;align-items:center;gap:4px}
.zoomctl button{min-width:30px;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-size:15px;font-weight:600;color:var(--ink)}
.zoomctl button:hover{border-color:var(--accent)}
.zoomctl .zl{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.zoomctl .zh{font-size:12px;color:var(--muted);margin-right:6px}
svg.map{display:block;width:100%;height:auto}
svg text{font-family:var(--f-body)}
.seat{stroke:var(--r-stroke);stroke-width:.8}
.seat.bold{stroke:var(--ink);stroke-width:3.2}
.seat-t{fill:var(--r-text);text-anchor:middle;dominant-baseline:central;pointer-events:none;font-weight:600}
.seat-t.inv{fill:var(--s-fix-ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:2px}
.cal .dow{font-size:13px;color:var(--muted);text-align:center;font-weight:600}
.cal .dow.sun{color:var(--cal-sun-ink)} .cal .dow.sat{color:var(--cal-sat-ink)}
.cal .day{background:var(--bg);border:1px solid var(--line);border-radius:8px;min-height:70px;padding:5px 6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .day.blank{background:none;border:none}
.cal .day.sun{background:var(--cal-sun)} .cal .day.sat{background:var(--cal-sat)}
.cal .day.sun .dn{color:var(--cal-sun-ink)} .cal .day.sat .dn{color:var(--cal-sat-ink)}
.cal .day .dn{font-size:19px;line-height:1.1;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.cal .day.today .dn{color:var(--accent)}
.cal .day.event{background:var(--accent);border-color:var(--accent)}
.cal .day.event .dn,.cal .day.event .ev{color:var(--accent-ink)}
.cal .ev{font-family:var(--f-disp);font-size:15px;line-height:1.2}
.cal .day.has-sel{border-color:#1B2723;box-shadow:0 0 0 2px var(--mark)}
.calchip{display:flex;gap:5px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 5px;font-size:12px;line-height:1.3;color:var(--ink);cursor:pointer;min-width:0;overflow-wrap:anywhere}
.calchip b{flex:none;min-width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:11px}
.calchip:hover{border-color:var(--accent)}
.calchip.sel{background:var(--mark);border-color:#1B2723;color:#1B2723;font-weight:600}
.calchip.sel b{background:#1B2723;color:#F3C546}
.calchip.me{background:var(--mark-soft)}
.calchip.dim{opacity:.35}
@media (max-width:720px){.cal{gap:3px}.cal .day{padding:4px 3px}.cal .day .dn{font-size:15px}.calchip span{display:none}}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);padding:6px 4px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--r-stroke)}
.legend .rt{width:18px;height:0;border:none;border-top:2.5px dashed var(--route);border-radius:0;vertical-align:3px}

/* map pieces */
.room{stroke:var(--r-stroke);stroke-width:.6}
.room.hall{stroke:none}
.rlabel{fill:var(--r-text);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.faded{opacity:var(--dim)}
.room.on{fill:var(--mark-soft);stroke:var(--accent);stroke-width:2}
.rname{fill:var(--ink);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.rsub{fill:var(--accent);font-weight:600;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tag{cursor:pointer}
.tag .pill{fill:var(--tag-bg);stroke:var(--accent);stroke-width:1.6}
.tag .badge{fill:var(--accent)}
.tag .bnum{fill:var(--accent-ink);font-weight:700;text-anchor:middle;dominant-baseline:central;font-size:11px}
.tag .cap{fill:var(--muted);font-size:11px}
.tag .nm{fill:var(--ink);font-weight:700;font-size:15px}
.tag .lead{stroke:var(--accent);stroke-width:1.4;fill:none;stroke-linejoin:round}
.tag .anchor{fill:var(--accent);stroke:var(--tag-bg);stroke-width:1.5}
.tag.cont .pill{stroke-dasharray:4 3}
.tag.sel .pill{fill:var(--mark);stroke:#1B2723;stroke-width:3}
.tag.sel .nm,.tag.sel .cap{fill:#1B2723}
.tag.sel .badge{fill:#1B2723}
.tag.sel .bnum{fill:#F3C546}
.tag.sel .lead{stroke:#1B2723;stroke-width:2.5}
.tag.sel .anchor{fill:#1B2723;stroke:var(--mark);stroke-width:2}
.pulse{fill:none;stroke:var(--mark);stroke-width:3}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.4s ease-out infinite}}
@keyframes pulse{from{r:5;opacity:1}to{r:26;opacity:0}}
.room.on.sel{fill:var(--mark);stroke:#1B2723;stroke-width:3}
.tag.dimmed{opacity:.25}
.tag.me .pill{fill:var(--mark);stroke:var(--ink)}
.tag.me .nm,.tag.me .cap{fill:#1B2723}
.route.guide{stroke-width:4}
.route{fill:none;stroke:var(--route);stroke-width:3;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){.route{animation:flow 1.2s linear infinite}}
@keyframes flow{to{stroke-dashoffset:-14}}
.site-txt{fill:var(--ink2);font-weight:600;text-anchor:middle;dominant-baseline:central}
.site-sm{fill:var(--muted);text-anchor:middle;dominant-baseline:central}

/* tasks */
.tasks{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tasks h3{font-size:13px;letter-spacing:.04em;color:var(--accent);margin:10px 0 2px;font-weight:600}
.tasks h3:first-child{margin-top:0}
.tasks .gnote{margin:0 0 4px;font-size:13px;color:var(--ink2);background:var(--bg);border-radius:8px;padding:6px 10px}
.item{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;padding:9px 6px;border-radius:10px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none}
.item.sel{background:var(--mark-soft);box-shadow:inset 4px 0 0 var(--mark)}
.item.me{background:var(--mark-soft);box-shadow:inset 3px 0 0 var(--mark)}
.num{border:none;padding:0;cursor:pointer;transition:transform .12s;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.num.none{background:var(--line);color:var(--ink2)}
.num.cont{background:none;border:1.5px dashed var(--accent);color:var(--accent)}
.num:hover{transform:scale(1.15)}
.num.sel{background:var(--mark);color:#1B2723;box-shadow:0 0 0 3px #1B2723;transform:scale(1.15)}
.itime{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.itask{font-weight:600;line-height:1.35}
.idetail{font-size:13px;color:var(--ink2)}
.iwhere{font-size:12.5px;color:var(--accent);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.slot{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.nmi{font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:var(--bg);border:1px dashed var(--r-stroke);border-radius:7px;padding:2px 8px;min-width:3.2em;max-width:100%}
.nmi:hover{border-color:var(--accent)}
.nmi:focus{outline:none;border-style:solid;border-color:var(--accent);background:var(--paper);box-shadow:0 0 0 3px var(--accent-soft)}
.nmi:disabled{border-color:transparent;background:none}
.nmi.empty{color:var(--muted);font-weight:400}
.iimg{display:block;max-width:220px;width:100%;border-radius:6px;border:1px solid var(--line);margin-top:6px}
.gear{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink2);align-self:center}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0;border-top:1px solid var(--line);padding-top:8px}

/* people */
.people{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px}
.people h2{font-family:var(--f-disp);font-weight:400;font-size:24px;margin:0 0 4px}
.people p.sub{margin:0 0 10px;color:var(--ink2);font-size:13.5px}
.namelist{display:flex;flex-wrap:wrap;gap:6px}
.namelist button{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:14px}
.namelist button[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:#1B2723;font-weight:600}
.namelist button:hover{border-color:var(--accent)}
.day{display:flex;flex-direction:column;gap:6px}
.day .empty{color:var(--muted);font-size:14px;padding:10px 0}
.dayrow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;text-align:left;background:var(--bg);border:1px solid transparent;border-radius:10px;padding:8px 10px}
.dayrow:hover{border-color:var(--accent)}
.dayrow.today{background:var(--day-pink);border-color:var(--day-pink-line)}
.daykey{display:inline-flex;gap:10px;font-size:12px;color:var(--muted);margin-left:auto}
.daykey i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line);background:var(--bg)}
.daykey i.today{background:var(--day-pink);border-color:var(--day-pink-line)}
.dayrow .dt{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.dayrow .dp{font-size:12px;color:var(--muted)}
.dayrow .dd{font-weight:600}
.dayrow .dw{font-size:13px;color:var(--ink2)}
.dayhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.dayhead strong{font-family:var(--f-disp);font-size:26px;font-weight:400}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--route)}

@media (min-width:1081px){
  .tasks{position:sticky;top:calc(var(--steps-h,76px) + var(--ph-h,96px));max-height:calc(100vh - var(--steps-h,76px) - var(--ph-h,96px) - 12px);overflow:auto}
}
.tasks .tail{flex:none}
#blackout{position:fixed;inset:0;z-index:100;background:#000;cursor:none}
.maps figure{scroll-margin-top:calc(var(--steps-h,76px) + var(--ph-h,96px) + 8px)}
.stage:fullscreen .maps figure,.stage.fs .maps figure{scroll-margin-top:calc(var(--ph-h,96px) + 10px)}
@media (max-width:1080px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .people{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  .steps{grid-template-columns:repeat(4,minmax(0,1fr));position:static}
  .step .n{font-size:16px}
  .savebox{align-items:flex-start}
  .savebox .row{justify-content:flex-start}
  .dayrow{grid-template-columns:minmax(0,1fr)}
}

const NOT_STAFF = ['내빈','업체','협의체 위원'];
const isGuestSlot = id => { const it = Object.values(ITEM).find(x=>x.slots.some(s=>s[0]===id)); return !!(it && it.guests); };                      // 명단에서 뺌
const LESSON_SLOTS = ['c1a','c2a','c3a','c4a','c5a','c6a','c7a','c8a','c9a','c10a'];
const GROUP_OF = () => ({
  ...DEPT,
  '분과 대표': DEPT_REPS, '분과대표': DEPT_REPS,
  '담임': [...DEPT.수업분과, '연구'],
  '부장': ['강지훈','연구','박동진','교무','김대성'],

  '정보': ['김대성'],

});
// 이름 칸 하나 → 사람 목록 (전교직원은 전체)
function expandName(tok, groups, all){
  if(NOT_STAFF.includes(tok)) return [];
  if(tok==='전교직원' || tok==='전 교직원') return all;
  if(groups[tok]) return groups[tok].flatMap(x=> groups[x] && x!==tok ? expandName(x, groups, all) : [ALIAS[x]||x]);
  return [ALIAS[tok]||tok];
}
function staffList(){
  const groups = GROUP_OF(), set = new Set(FIXED);
  Object.values(groups).forEach(list=>list.forEach(n=>{ if(!groups[n]) set.add(ALIAS[n]||n); }));
  Object.keys(DEFAULTS).filter(id=>!isGuestSlot(id)).forEach(id=>tokens(nameOf(id)).forEach(tok=>{
    if(tok==='전교직원' || tok==='전 교직원' || NOT_STAFF.includes(tok)) return;
    expandName(tok, groups, []).forEach(n=>set.add(n));
  }));
  const fixed = FIXED.filter(n=>set.has(n));
  const rest = [...set].filter(n=>!FIXED.includes(n)).sort((a,b)=>a.localeCompare(b,'ko'));
  return [...fixed, ...rest];
}
// 이 칸에 선택한 선생님이 들어가는지 (묶음 포함)
function slotHasPerson(slotId, who){
  const groups = GROUP_OF(), all = staffList();
  return tokens(nameOf(slotId)).some(tok=>expandName(tok, groups, all).includes(who));
}
const itemHasPerson = it => person && it.slots.some(s=>slotHasPerson(s[0], person));

const CATVAR = {cls:'--r-cls',sp:'--r-sp',adm:'--r-adm',kid:'--r-kid',wc:'--r-wc',hall:'--r-hall',aft:'--r-aft'};
function roomLabel(r, fsMax){
  const [f,x,y,w,h,c,t] = r; if(!t) return '';
  const parts = t.split(' ');
  const lines = (tw(t,10) > w-4 && parts.length>1) ? parts : [t];
  const longest = Math.max(...lines.map(l=>tw(l,1)));
  const fs = Math.max(5.5, Math.min(fsMax, (w-3)/longest, (h-2)/(lines.length*1.15)));
  const cy = y+h/2, lh = fs*1.12, y0 = cy - (lines.length-1)*lh/2;
  return lines.map((l,i)=>`<text class="rlabel" x="${x+w/2}" y="${y0+i*lh}" font-size="${fs.toFixed(1)}">${esc(l)}</text>`).join('');
}
function roomRect(r, cls='', fillVar=null){
  const [f,x,y,w,h,c] = r;
  return `<rect class="room ${c==='hall'?'hall':''} ${cls}" x="${x}" y="${y}" width="${w}" height="${h}" fill="var(${fillVar||CATVAR[c]})"/>`;
}

  s += `<rect x="224" y="823" width="16" height="4" fill="var(--accent)"/><rect x="273" y="823" width="16" height="4" fill="var(--accent)"/>`;
  // 방위
  // 방위: 배치도 왼쪽이 북쪽
  s += `<g transform="translate(796 690)"><path d="M-14 0 L4 -6 L0 0 L4 6 Z" fill="var(--ink2)"/><text class="site-txt" x="-24" y="0" font-size="11">북</text></g>`;
  s += `<text class="site-txt" x="-141" y="686" font-size="13">데시앙 아파트</text>`;
  return s;
}

function tagSVG(o){
  const {x,y,tx,ty,num,cap,nm,cls,id} = o;
  const capW = tw(cap,11), nmW = tw(nm,15);
  const tx0 = num==null ? 12 : 31;                 // 번호 배지가 없으면 글자를 왼쪽으로
  const w = tx0 + 3 + Math.max(capW,nmW) + 10, h = 38;
  const lx = tx - w/2, ly = ty - h/2;
  let s = `<g class="tag ${cls}" data-item="${id}" tabindex="0" role="button" aria-label="${esc((num==null?'':num+'. ')+cap+' '+nm)}">`;
  if(o.paths) o.paths.forEach(d=>{ s += `<path class="lead" d="${d}"/>`; });   // 꺾인 연결선
  (o.anchors || [[x,y]]).forEach(([ax,ay])=>{
    if(o.sel) s += `<circle class="pulse" cx="${ax}" cy="${ay}" r="5"/>`;
    if(!o.paths && Math.hypot(tx-ax,ty-ay) > 6) s += `<line class="lead" x1="${ax}" y1="${ay}" x2="${tx}" y2="${ty}"/>`;
    s += `<circle class="anchor" cx="${ax}" cy="${ay}" r="4"/>`;
  });
  s += `<rect class="pill" x="${lx}" y="${ly}" width="${w}" height="${h}" rx="9"/>`;
  if(num!=null) s += `<circle class="badge" cx="${lx+15}" cy="${ty}" r="10"/><text class="bnum" x="${lx+15}" y="${ty+.5}">${esc(num)}</text>`;
  s += `<text class="cap" x="${lx+tx0}" y="${ty-6}">${esc(cap)}</text>`;
  s += `<text class="nm" x="${lx+tx0}" y="${ty+12}">${esc(nm)}</text>`;
  return s + `</g>`;
}

function phaseItems(p){
  // 번호 붙이기 (ref 포함)
  let n = 0;
  return p.items.map(it=>{
    if(it.group) return it;
    const num = p.noNum ? null : ++n;
    if(it.ref){ const src = ITEM[it.ref]; return {...src, cont:true, num, srcId:src.id}; }
    return {...it, num, srcId:it.id};
  });
}

function renderSite(){
  const p = PHASES[phaseIdx];
  const items = phaseItems(p).filter(it=>!it.group && it.loc && LOC[it.loc]);
  let s = siteBase();
  // 선택한 역할에 유도선이 있으면 표시
  const gItem = sel && ITEM[sel];
  if(gItem && gItem.guide) s += `<path class="route guide" d="${GUIDES[gItem.guide]}" marker-end="url(#arr)"/>`;
  (p.routes||[]).forEach(k=>ROUTES[k].paths.forEach(d=>{
    const noArrow = d[0]==='!';                     // '!' = 합류 지점까지 가는 선 (화살표 없음)
    s += `<path class="route" d="${noArrow?d.slice(1):d}"${noArrow?'':' marker-end="url(#arr)"'}/>`;
  }));
  s = `<defs><marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--route)"/></marker></defs>` + s;
  // 같은 장소는 겹쳐 쌓기
  const byLoc = {};
  let selTag = '';
  items.forEach(it=>{ (byLoc[it.loc] ||= []).push(it); });
  Object.entries(byLoc).forEach(([k,list])=>{
    const L = LOC[k];
    list.forEach((it,i)=>{
      const dir = L.stack || -1;
      const ty = L.ty + dir*i*44*(L.inside? .85 : 1);
      const cap = it.task.replace(/\s*\(.*?\)\s*/g,' ').trim();
      const nm = itemNames(it).join(' · ') || '미정';
      const isSel = sel===it.srcId;
      const cls = [it.cont?'cont':'', isSel?'sel':'', (sel && !isSel) ? 'dimmed' : person ? (itemHasPerson(it)?'me':'dimmed') : ''].join(' ');
      const svgTag = tagSVG({x:L.x,y:L.y,anchors:L.anchors,tx:L.tx,ty,num:it.num,cap:shortCap(cap),nm,cls,id:it.srcId,sel:isSel});
      if(isSel) selTag = svgTag; else s += svgTag;
    });
  });
  document.getElementById('site').innerHTML = s + selTag;   // 선택한 이름표는 맨 위에
  document.getElementById('routeNote').textContent = (p.routes||[]).map(k=>'· '+ROUTES[k].note).join('  ');
}
function shortCap(c){ return c.length>16 ? c.slice(0,15)+'…' : c; }
// 목록에 쓰는 위치 이름
function locName(it){
  if(it.where) return it.where;
  if(it.hloc) return HLOC[it.hloc].name;
  return (it.loc && LOC[it.loc]) ? LOC[it.loc].name : '';
}
const hasMap = it => !!(it.loc || it.hloc);

    const nm = it.tagName || itemNames(it).join(' · ') || '미정';
    const isSel = sel===it.srcId;
    const cls = [isSel?'sel':'', (sel && !isSel) ? 'dimmed' : person ? (itemHasPerson(it)?'me':'dimmed') : ''].join(' ');
    const svgTag = tagSVG({x:L.anchors[0][0], y:L.anchors[0][1], anchors:L.anchors, paths:L.paths, tx:L.tx, ty:L.ty, num:it.num, cap:shortCap(cap), nm, cls, id:it.srcId, sel:isSel});

function renderCal(){
  const p = PHASES[phaseIdx];
  const items = phaseItems(p).filter(it=>!it.group && it.due);
  const byDay = {};
  items.forEach(it=>{ (byDay[it.due] ||= []).push(it); });
  // 일(빨강) 월~금 토(파랑), 10월 날짜만
  const DOWCLS = ['sun','','','','','','sat'];
  let h = ['일','월','화','수','목','금','토'].map((d,i)=>`<div class="dow ${DOWCLS[i]}">${d}</div>`).join('');
  const lead = new Date(2026, 9, 1).getDay();      // 10월 1일 앞 빈칸
  for(let i=0; i<lead; i++) h += `<div class="day blank"></div>`;
  for(let day=1; day<=31; day++){
    const dw = new Date(2026, 9, day).getDay();
    const key = `10-${String(day).padStart(2,'0')}`;
    const list = byDay[key] || [];
    const event = day===27;
    const hasSel = list.some(it=>it.srcId===sel);
    h += `<div class="day ${DOWCLS[dw]}${event?' event':''}${hasSel?' has-sel':''}"><span class="dn">${day}</span>`;
    if(event) h += `<span class="ev">보고회 당일</span>`;
    list.forEach(it=>{

      h += `<button type="button" class="calchip ${cls}" data-sel="${it.srcId}" data-cal="1" title="${esc(it.task)}"><b>${it.num}</b><span>${esc(it.task)}</span></button>`;

  }
  document.getElementById('cal').innerHTML = h;
}

/* 위층 (4 → 3 → 2층) */
const UCROP = {4:[112,206],3:[310,414],2:[505,616]};
const UX0 = 140, UX1 = 725;
function renderUpper(){
  const p = PHASES[phaseIdx];
  const fig = document.getElementById('upperFig');
  fig.hidden = !p.upper;
  if(!p.upper) return;
  // 교실별 표시 내용
  const marks = {}; // roomKey -> {top, names, itemId, num, cls}
  phaseItems(p).forEach(it=>{
    if(it.group || it.loc!=='U') return;
    const hl = sel===it.srcId, me = person && itemHasPerson(it);
    if(it.perSlotRoom){
      it.slots.forEach(sl=>{
        const nm = nameOf(sl[0]) || '미정';
        const mine = person && tokens(nameOf(sl[0])).includes(person);
        marks[sl[3]] = {top:sl[1]+' 하교', nm, note:SPECIAL_NAME[sl[3]], id:it.srcId, hl, me:mine, oneLine:true};
      });
    } else {
      const nm = itemNames(it).join('·') || '미정';
      it.uroom.forEach(rk=>{ marks[rk] = {top: (it.roomTop&&it.roomTop[rk]) || it.short || rk, nm, note:SPECIAL_NAME[rk], id:it.srcId, hl, me, tone:it.tone}; });
    }
  });
  let s = '', off = 0;
  [4,3,2].forEach(f=>{
    const [y0,y1] = UCROP[f];
    const H = y1-y0;
    s += `<text class="site-txt" x="${UX0+2}" y="${off+11}" font-size="14" style="text-anchor:start">${f}층</text>`;
    s += `<clipPath id="uc${f}"><rect x="${UX0}" y="${y0}" width="${UX1-UX0}" height="${H}"/></clipPath>`;
    s += `<g transform="translate(0 ${off+22-y0})" clip-path="url(#uc${f})">`;
    const rs = ROOMS.filter(r=>r[0]===f && r[2]<y1 && r[2]+r[4]>y0 && r[1]<UX1 && r[1]+r[3]>UX0);
    const keyOf = r => Object.keys(UROOM).find(k=>UROOM[k][0]===f && UROOM[k][1]===r[6]);
    rs.forEach(r=>{
      const k = keyOf(r), m = k && marks[k];
      if(m){
        const cls = 'on' + (m.hl?' sel':'');
        const dim = sel ? !m.hl : (person && !m.me);
        const tone = m.tone==='help' && !m.hl && !(m.me&&!sel) ? 'fill:var(--help-fill);stroke:var(--help-line);' : '';   // 도움반은 보라색 칸
        s += `<rect class="room ${cls}" x="${r[1]}" y="${r[2]}" width="${r[3]}" height="${r[4]}" data-item="${m.id}" style="${tone}${m.me&&!sel?'fill:var(--mark);':''}${dim?'opacity:.35;':''}"/>`;
      } else {
        s += `<g class="faded">${roomRect(r)}${roomLabel(r,9)}</g>`;
      }
    });
    rs.forEach(r=>{
      const k = keyOf(r), m = k && marks[k];
      if(!m) return;
      const cx = r[1]+r[3]/2, cy = r[2]+r[4]/2;
      // 모든 교실을 같은 한 줄 형식으로: "3-1 하교 심미순"
      // 한 줄: "3-1 최대인" / 특별실은 두 줄: "4-1 박동진" + "꿈꾸는 놀이터" (글자 크기는 다른 교실과 같게)
      const FS = 19*0.62;                                  // 모든 교실 공통 글자 크기
      const one = `${m.top} ${m.nm}`;
      // 하교 지도는 항상 한 줄(글자를 줄여 맞춤), 특별실은 두 줄
      const lines = m.note ? [one, m.note] : (m.oneLine || tw(one,FS) <= r[3]-6) ? [one] : [m.top, m.nm];
      const widest = Math.max(...lines.map(l=>tw(l,1)));
      const fs = Math.max(m.oneLine ? 6 : 8, Math.min(FS, (r[3]-6)/widest));
      const dark = m.hl || (m.me && !sel);
      const dim = sel ? !m.hl : (person && !m.me);
      const lh = fs*1.12, y0 = cy - (lines.length-1)*lh/2;
      lines.forEach((l,i)=>{
        s += `<text class="rname" x="${cx}" y="${(y0+i*lh).toFixed(1)}" font-size="${fs.toFixed(1)}" style="${dark?'fill:#1B2723;':''}${dim?'opacity:.4;':''}">${esc(l)}</text>`;
      });
    });
    s += `</g>`;
    off += H + 30;
  });
  const svg = document.getElementById('upper');
  setBase('upper', [UX0-4, -4, UX1-UX0+8, off-2]);
  svg.innerHTML = s;
}

  box.innerHTML = h + `<div class="tail" aria-hidden="true"></div>`;
  box.scrollTop = 0;

}

// 고정된 머리 줄 높이 → 오른쪽 목록이 그 아래에서 시작하도록
function setPhH(){
  const st = document.querySelector('.stage'), ph = document.querySelector('.phasehead');
  if(st && ph) st.style.setProperty('--ph-h', ph.offsetHeight + 'px');
  const steps = document.getElementById('steps');
  if(steps) document.documentElement.style.setProperty('--steps-h', getComputedStyle(steps).position==='sticky' ? (steps.offsetHeight + 8) + 'px' : '0px');

// 목록이 따로 스크롤되는 화면인지
const tasksScrolls = box => getComputedStyle(box).overflowY === 'auto';
function sizeTail(){
  const box = document.getElementById('tasks'), tail = box && box.querySelector('.tail');
  if(!tail) return;
  tail.style.height = tasksScrolls(box) ? Math.max(0, box.clientHeight - 140) + 'px' : '0px';
}
// 번호가 표시된 배치도(1층 / 2~4층)로 화면 이동
function mapFigOf(id){
  const it = ITEM[id];
  if(!it || !hasMap(it)) return null;
  if(it.loc==='U'){ const f = document.getElementById('upperFig'); return f.hidden ? null : f; }
  return mainFig();
}
function scrollToMap(id){
  const fig = mapFigOf(id);
  if(!fig) return;
  const smooth = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  fig.scrollIntoView({block:'start', behavior:smooth});
}
// 선택한 번호를 목록 맨 위(배치도 옆)로 부드럽게 올림
function scrollItemTop(id){
  const box = document.getElementById('tasks');
  const el = box.querySelector(`.item[data-item="${id}"]`);
  if(!el) return;
  const smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth' : 'auto';
  if(!tasksScrolls(box)){ if(!mapFigOf(id)) el.scrollIntoView({block:'nearest', behavior:smooth}); return; }
  sizeTail();
  // 묶음 제목 바로 아래 첫 항목이면 제목도 함께 보이게
  let top = el;
  let prev = el.previousElementSibling;
  while(prev && (prev.tagName==='H3' || prev.classList.contains('gnote'))){ top = prev; prev = prev.previousElementSibling; }
  const y = top.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - 12;
  box.scrollTo({top: Math.max(0, y), behavior: smooth});
}
window.addEventListener('resize', setPhH);
// 단계마다 쓰는 배치도: 1층(기본) / 중동관 좌석(map:'hall') / 사전 준비 일정표(map:'cal')
function renderMaps(){

const mainFig = () => ['siteFig','hallFig','calFig'].map(id=>document.getElementById(id)).find(f=>!f.hidden);
function renderAll(){ renderSteps(); renderHead(); renderMaps(); renderTasks(); renderPeople(); }
function go(i){

  sel = null;
  try{ history.replaceState(null,'','#'+PHASES[phaseIdx].id); }catch(e){}

// 단계가 바뀌면 그 단계의 중심 배치도가 보이게: 수업 공개는 2~4층, 나머지는 1층
function focusPhaseMap(){
  const smooth = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  const upper = document.getElementById('upperFig');
  if(PHASES[phaseIdx].focusUpper && !upper.hidden){ upper.scrollIntoView({block:'start', behavior:smooth}); return; }
  const site = mainFig();
  const limit = parseFloat(getComputedStyle(site).scrollMarginTop) || 0;

/* ---------- 이벤트 ---------- */
document.addEventListener('click', e=>{

  const sb = e.target.closest('[data-sel]');

  if(e.target.id==='clearPerson'){ person=null; renderPeople(); renderMaps(); renderTasks(); return; }
  if(e.target.id==='prevBtn'){ e.target.blur(); return stepPrev(); }
  if(e.target.id==='nextBtn'){ e.target.blur(); return stepNext(); }

/* ---------- 키보드 · 프레젠터(발표기) ----------
   발표기 다음/이전 버튼은 기종에 따라 PageDown/PageUp, →/←, ↓/↑, 스페이스를 보냄.
   발표 시작 버튼(F5)은 전체화면, 화면 가리기(B · .)는 검은 화면. */
let lastStepAt = 0;
const STEP_GAP = 400;   // ms: 발표기가 한 번 누를 때 두 번 보내거나 키가 반복되어도 한 칸만 넘김
document.addEventListener('keydown', e=>{
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key, inInput = e.target.matches('input, textarea');
  const fs = isFs();
  // 발표기 다음/이전: 이름 칸을 고치던 중이어도 PageDown/PageUp은 넘김
  const NEXT = ['PageDown','ArrowRight'], PREV = ['PageUp','ArrowLeft'];
  if(fs){ NEXT.push('ArrowDown',' ','Enter','n','N'); PREV.push('ArrowUp','Backspace','p','P'); }
  if(inInput && !['PageDown','PageUp'].includes(k)){ if(k==='Enter') e.target.blur(); return; }
  if(blackout.hidden===false && (NEXT.includes(k) || PREV.includes(k) || k==='b' || k==='B' || k==='.' || k==='Escape')){
    e.preventDefault(); blackout.hidden = true; return;                       // 검은 화면은 아무 키나 누르면 해제
  }
  if((k==='Enter'||k===' ') && e.target.matches('svg [data-item]')){ e.preventDefault(); select(e.target.dataset.item, false); return; }
  if((NEXT.includes(k) || PREV.includes(k)) && locked()){ e.preventDefault(); flashLocked(); return; }
  if(NEXT.includes(k) || PREV.includes(k)){
    e.preventDefault();
    if(inInput) e.target.blur();
    if(e.repeat) return;                                   // 버튼을 길게 눌러 생긴 반복 신호
    const now = performance.now();
    if(now - lastStepAt < STEP_GAP) return;                // 한 번 누름에 두 번 들어온 신호
    lastStepAt = now;
    NEXT.includes(k) ? stepNext() : stepPrev();
    return;
  }
  if(k==='F5'){ e.preventDefault(); enterFs(); return; }                          // 발표 시작 버튼
  if(k==='b' || k==='B' || k==='.'){ e.preventDefault(); blackout.hidden = false; return; }   // 화면 가리기
  if(k==='Escape'){ if(stage.classList.contains('fs')) exitFs(); else if(sel) select(null); }
});
function select(id, reveal){
  sel = id;
  renderMaps();
  document.querySelectorAll('.item').forEach(el=>el.classList.toggle('sel', el.dataset.item===id));
  document.querySelectorAll('.num[data-sel]').forEach(b=>{ const on = b.dataset.sel===id; b.classList.toggle('sel', on); b.setAttribute('aria-pressed', on); });
  if(id && reveal){ revealOnMap(id); scrollToMap(id); }
  updateNav();
  syncOut();
}

/* 단계 안에서 번호 차례로 → 마지막 번호 다음은 다음 단계 */
const stepIds = p => p.noNum ? [] : phaseItems(p).filter(it=>!it.group).map(it=>it.srcId);
function showItem(id){
  select(id, true);
  if(id) scrollItemTop(id);
}
function stepNext(){
  const ids = stepIds(PHASES[phaseIdx]);
  const i = sel ? ids.indexOf(sel) : -1;
  if(i < ids.length-1) return showItem(ids[i+1]);
  if(phaseIdx < PHASES.length-1) go(phaseIdx+1);
}
function stepPrev(){
  const ids = stepIds(PHASES[phaseIdx]);
  const i = sel ? ids.indexOf(sel) : -1;
  if(i > 0) return showItem(ids[i-1]);
  if(i === 0) return select(null);
  if(phaseIdx > 0){
    go(phaseIdx-1);
    const prev = stepIds(PHASES[phaseIdx]);
    if(prev.length) showItem(prev[prev.length-1]);
  }
}
function updateNav(){
  const ids = stepIds(PHASES[phaseIdx]);
  const i = sel ? ids.indexOf(sel) : -1;
  document.getElementById('prevBtn').disabled = phaseIdx===0 && i<0;
  document.getElementById('nextBtn').disabled = phaseIdx===PHASES.length-1 && i===ids.length-1;
  const last = i===ids.length-1 && phaseIdx<PHASES.length-1;
  document.getElementById('nextBtn').textContent = last ? '다음 단계 →' : '다음 →';
  document.getElementById('posTxt').textContent = !ids.length ? `${phaseIdx+1}단계 전체` : i<0 ? `전체 보기 · ${ids.length}개` : `${i+1} / ${ids.length}`;
  if(locked()){ document.getElementById('prevBtn').disabled = true; document.getElementById('nextBtn').disabled = true; }
}

/* ---------- 함께보기: 진행자 화면을 따라가기 ----------
   공개 MQTT 중계 서버로 '지금 단계·번호'만 주고받음 (이름 등 다른 정보는 보내지 않음).
   진행자가 보낸 마지막 위치는 서버에 남겨 두어, 늦게 들어온 사람도 바로 같은 화면으로 맞춤. */
const SYNC = {
  lib: 'https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js',
  broker: (()=>{ try{ return localStorage.getItem('jd-sync-broker') || 'wss://broker.emqx.io:8084/mqtt'; }catch(e){ return 'wss://broker.emqx.io:8084/mqtt'; } })(),
  topic: 'gwangyang-jungdong-es/sueop-nanum-2026/sync-v1',
};
const ME = Math.random().toString(36).slice(2,10);
let syncMode = 'solo', isLead = false, mq = null, applyingRemote = false;
const locked = () => syncMode==='together' && !isLead;
function setSyncStatus(text){
  const el = document.getElementById('syncStatus');
  el.hidden = !text; el.textContent = text || '';
  const badge = document.getElementById('syncBadge');
  badge.hidden = syncMode!=='together';
  badge.textContent = isLead ? '함께보기 · 내가 진행' : '함께보기 · 따라가는 중';
  badge.classList.toggle('lead', isLead);
}
function flashLocked(){ setSyncStatus('함께보기 중에는 진행자가 넘깁니다. 직접 넘기려면 혼자보기로 바꾸세요.'); clearTimeout(flashLocked.t); flashLocked.t = setTimeout(()=>syncStatusNow(), 2500); }
function syncStatusNow(){
  if(syncMode!=='together') return setSyncStatus('');
  if(!mq || !mq.connected) return setSyncStatus('함께보기 연결 중…');
  setSyncStatus(isLead ? '내 화면이 함께보기 중인 모든 화면에 보입니다' : '진행자 화면을 따라갑니다');
}
function loadMqtt(){
  if(window.mqtt) return Promise.resolve(window.mqtt);
  return new Promise((ok, fail)=>{
    const s = document.createElement('script'); s.src = SYNC.lib;
    s.onload = ()=> window.mqtt ? ok(window.mqtt) : fail(new Error('no mqtt'));
    s.onerror = fail; document.head.appendChild(s);
  });
}
async function startTogether(){
  syncMode = 'together'; isLead = false;
  document.getElementById('leadBtn').hidden = false;
  document.getElementById('leadBtn').setAttribute('aria-pressed','false');
  syncStatusNow(); updateNav();
  if(window.claude){ setSyncStatus('이 화면에서는 함께보기를 쓸 수 없습니다. GitHub Pages 주소로 열어 주세요.'); return; }
  try{
    const lib = await loadMqtt();
    if(syncMode!=='together') return;
    mq = lib.connect(SYNC.broker, {clientId:'jd-'+ME, reconnectPeriod:3000, connectTimeout:8000, clean:true});
    mq.on('connect', ()=>{ mq.subscribe(SYNC.topic); syncStatusNow(); if(isLead) syncOut(true); });
    mq.on('reconnect', ()=> setSyncStatus('연결이 끊겨 다시 연결하는 중…'));
    mq.on('offline', ()=> setSyncStatus('인터넷 연결을 확인해 주세요 · 다시 연결하는 중…'));
    mq.on('message', (topic, buf)=>{
      let m; try{ m = JSON.parse(buf.toString()); }catch(e){ return; }
      if(!m || m.from===ME || isLead || syncMode!=='together') return;
      if(Date.now() - (m.t||0) > 12*3600*1000) return;           // 오래된 기록은 무시
      applySync(m);
    });
  }catch(e){ setSyncStatus('함께보기 연결에 실패했습니다 · 인터넷 연결을 확인해 주세요'); }
}
function stopTogether(){
  syncMode = 'solo'; isLead = false;
  if(mq){ try{ mq.end(true); }catch(e){} mq = null; }
  document.getElementById('leadBtn').hidden = true;
  setSyncStatus(''); updateNav();
}
function syncOut(force){
  if(applyingRemote || syncMode!=='together' || !isLead || !mq || !mq.connected) return;
  mq.publish(SYNC.topic, JSON.stringify({from:ME, p:PHASES[phaseIdx].id, s:sel||null, t:Date.now()}), {qos:1, retain:true});
}
function applySync(m){
  applyingRemote = true;
  try{
    const i = PHASES.findIndex(p=>p.id===m.p);
    if(i>=0 && i!==phaseIdx) go(i);
    if((m.s||null)!==sel){ select(m.s||null, !!m.s); if(m.s) scrollItemTop(m.s); }
    updateNav();
  } finally { applyingRemote = false; }
}
document.getElementById('modeSolo').addEventListener('click', ()=>{

  }catch(err){ fallback(); }

/* ---------- 확대 · 축소 · 이동 ---------- */
const VIEW = { site:{base:[-205,668,1030,402], v:null}, upper:{base:null, v:null}, hall:{base:[-10,-70,1430,810], v:null} };
const MAXZ = 6;
function setBase(id, b){
  const z = VIEW[id];
  const changed = !z.base || z.base.join() !== b.join();
  z.base = b; if(changed) z.v = null;
  applyView(id);
}
function applyView(id){
  const z = VIEW[id]; if(!z.base) return;
  const v = z.v || z.base;
  document.getElementById(id).setAttribute('viewBox', v.map(n=>+n.toFixed(2)).join(' '));
  const zl = document.getElementById('zl_'+id);
  if(zl) zl.textContent = Math.round(z.base[2]/v[2]*100) + '%';
}
function clampView(id, v){
  const b = VIEW[id].base;
  let [x,y,w,h] = v;
  w = Math.min(b[2], Math.max(b[2]/MAXZ, w)); h = w * b[3]/b[2];
  x = Math.min(b[0]+b[2]-w, Math.max(b[0], x));
  y = Math.min(b[1]+b[3]-h, Math.max(b[1], y));
  return [x,y,w,h];
}
function toSvg(svg, cx, cy){
  const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy;
  const m = svg.getScreenCTM(); return m ? pt.matrixTransform(m.inverse()) : {x:0,y:0};
}
function zoomAt(id, factor, cx, cy){
  const z = VIEW[id]; if(!z.base) return;
  const svg = document.getElementById(id);
  const v = z.v || z.base;
  const p = (cx==null) ? {x:v[0]+v[2]/2, y:v[1]+v[3]/2} : toSvg(svg, cx, cy);
  const w = Math.min(z.base[2], Math.max(z.base[2]/MAXZ, v[2]*factor));
  const k = w / v[2];
  z.v = clampView(id, [p.x-(p.x-v[0])*k, p.y-(p.y-v[1])*k, w, 0]);
  if(z.v[2] >= z.base[2]-0.01) z.v = null;
  applyView(id);
}
function zoomBtn(id, what){
  if(what==='in') zoomAt(id, 1/1.4);
  else if(what==='out') zoomAt(id, 1.4);
  else { VIEW[id].v = null; applyView(id); }
}
function revealOnMap(id){
  ['site','upper','hall'].forEach(mid=>{
    const z = VIEW[mid]; if(!z.v) return;              // 전체 보기일 때는 이미 다 보임
    const svg = document.getElementById(mid);
    const els = [...svg.querySelectorAll(`[data-item="${id}"]`)];
    if(!els.length) return;
    const sr = svg.getBoundingClientRect();
    let l=Infinity,t=Infinity,r=-Infinity,b=-Infinity;
    els.forEach(el=>{ const q = el.getBoundingClientRect(); l=Math.min(l,q.left); t=Math.min(t,q.top); r=Math.max(r,q.right); b=Math.max(b,q.bottom); });
    if(l>=sr.left && r<=sr.right && t>=sr.top && b<=sr.bottom) return;
    const c = toSvg(svg, (l+r)/2, (t+b)/2);
    const v = z.v;
    z.v = clampView(mid, [c.x - v[2]/2, c.y - v[3]/2, v[2], v[3]]);
    applyView(mid);
  });
}
['site','upper','hall'].forEach(id=>{
  const svg = document.getElementById(id);
  // 마우스 휠은 페이지 스크롤에 맡김 (확대·축소는 +/− 버튼으로)
  const pts = new Map(); let drag = null, pinch = null, moved = false;
  svg.addEventListener('pointerdown', e=>{
    if(e.button!==undefined && e.button!==0) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    moved = false;
    if(pts.size===1){ drag = {x:e.clientX, y:e.clientY, v:(VIEW[id].v||VIEW[id].base).slice()}; }
    else if(pts.size===2){
      const [a,b] = [...pts.values()];
      pinch = {d:Math.hypot(a.x-b.x,a.y-b.y), v:(VIEW[id].v||VIEW[id].base).slice()}; drag = null;
    }
  });
  svg.addEventListener('pointermove', e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pinch && pts.size===2){
      const [a,b] = [...pts.values()];
      const d = Math.hypot(a.x-b.x,a.y-b.y);
      VIEW[id].v = pinch.v.slice();
      zoomAt(id, pinch.d/d, (a.x+b.x)/2, (a.y+b.y)/2);
      moved = true; return;
    }
    if(!drag) return;
    const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
    if(!moved && Math.hypot(dx,dy) < 4) return;
    if(!moved){ moved = true; svg.classList.add('dragging'); try{ svg.setPointerCapture(e.pointerId); }catch(err){} }
    const s = drag.v[2] / svg.getBoundingClientRect().width;
    if(!VIEW[id].v && drag.v[2] >= VIEW[id].base[2]-0.01) return;   // 전체 보기에서는 움직일 곳이 없음
    VIEW[id].v = clampView(id, [drag.v[0]-dx*s, drag.v[1]-dy*s, drag.v[2], drag.v[3]]);
    applyView(id);
  });
  const end = e=>{
    pts.delete(e.pointerId);
    if(pts.size<2) pinch = null;
    if(pts.size===0){ drag = null; svg.classList.remove('dragging'); }
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
  // 끌어서 옮긴 경우에는 이름표 클릭으로 처리하지 않음
  svg.addEventListener('click', e=>{ if(moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
});
document.getElementById('tasks').addEventListener('input', e=>{

let dbDoc = null, mode = 'connecting', saving = false, pending = {};
const LS_KEY = 'jd-report-names-v1';
function setStatus(kind, text){
  document.getElementById('saveStatus').innerHTML = `<span class="dot ${kind}"></span>${esc(text)}`;
}
function applyRemote(obj){
  overrides = {...obj, ...dirty};
  document.querySelectorAll('.nmi').forEach(inp=>{
    if(document.activeElement===inp) return;
    const v = nameOf(inp.dataset.slot) || '';

  });

}
function queueSave(id, v){
  overrides[id] = v; dirty[id] = v; pending[id] = v;
  if(mode==='local'){ try{ localStorage.setItem(LS_KEY, JSON.stringify(overrides)); }catch(e){} delete dirty[id]; pending={}; return; }
  flush();
}
async function flush(){
  if(saving || !dbDoc || !Object.keys(pending).length) return;
  saving = true; setStatus('busy','저장 중…');
  const batch = pending; pending = {};
  try{
    try{ await dbDoc.update({names:batch, updatedAt:Date.now()}); }
    catch(e){
      if(e && e.code==='invalid_argument'){ await dbDoc.set({names:{...overrides}, updatedAt:Date.now()}); }
      else throw e;
    }
    Object.keys(batch).forEach(k=>{ if(dirty[k]===batch[k]) delete dirty[k]; });
    setStatus('ok','공유 저장됨 · 모든 선생님 화면에 반영');
  }catch(e){
    if(e && e.code==='invalid_argument'){ readOnly = true; setStatus('warn','보기 전용 · 이름 수정 권한 없음'); renderTasks(); document.getElementById('resetRow').hidden = true; }
    else { Object.assign(pending, batch); setStatus('warn','저장 실패 · 잠시 후 다시 시도합니다'); setTimeout(flush, 2500 + Math.random()*1500); }
  }
  saving = false;
  if(Object.keys(pending).length) flush();
}

/* 되돌리기 (페이지 안에서 확인) */
document.getElementById('resetRow').addEventListener('click', async e=>{
  const row = document.getElementById('resetRow');
  if(e.target.id==='resetBtn'){
    row.innerHTML = `<span class="confirm">고친 이름을 모두 지우고 계획서 명단으로 되돌릴까요?</span><button class="ghost danger" id="resetYes" type="button">되돌리기</button><button class="ghost" id="resetNo" type="button">취소</button>`;
    return;
  }
  if(e.target.id==='resetNo' || e.target.id==='resetYes'){
    if(e.target.id==='resetYes'){
      Object.keys(dirty).forEach(k=>delete dirty[k]); pending = {};
      overrides = {};
      if(mode==='local'){ try{ localStorage.removeItem(LS_KEY); }catch(err){} }
      else if(dbDoc){ try{ await dbDoc.set({names:{}, updatedAt:Date.now()}); setStatus('ok','계획서 명단으로 되돌렸습니다'); }catch(err){ setStatus('warn','되돌리기 실패 · 편집 권한을 확인하세요'); } }
      renderAll();
    }
    row.innerHTML = `<button class="ghost" id="resetBtn" type="button">계획서 명단으로 되돌리기</button>`;
  }
});

(async ()=>{
  let db = null;
  try{ db = await window.claude?.use?.('db'); }catch(e){ db = null; }
  if(!db){
    mode = 'local';
    try{ overrides = JSON.parse(localStorage.getItem(LS_KEY)||'{}') || {}; }catch(e){ overrides = {}; }
    setStatus('warn','이 화면에서는 공유 저장이 안 됩니다 · 이 브라우저에만 저장');
    renderAll();
    return;
  }
  mode = 'db';
  dbDoc = db.doc('roster/names');
  setStatus('busy','명단 불러오는 중…');
  dbDoc.onSnapshot(snap=>{
    const d = snap.exists ? (snap.data()||{}) : {};
    applyRemote(d.names || {});
    if(!saving && !Object.keys(pending).length && !readOnly) setStatus('ok','공유 저장됨 · 모든 선생님 화면에 반영');
  }, err=>{
    setStatus('warn','공유 명단 연결이 끊겼습니다 · 새로고침해 주세요');
  });
})();

/* 시작 */
(()=>{
  const h = (location.hash||'').slice(1);
  const i = PHASES.findIndex(p=>p.id===h);
  if(i>=0) phaseIdx = i;
  renderAll();
})();
</script>
